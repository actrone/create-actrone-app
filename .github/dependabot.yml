version: 2

# Every action in .github/workflows is pinned to an exact commit SHA, which stops a
# retagged release from silently changing what runs in CI. The trade-off is that a
# pinned SHA never picks up a security fix on its own, so Dependabot owns bumping them
# (it rewrites the SHA and the trailing `# vX.Y.Z` comment together).
#
# There is deliberately no npm entry: this package has zero dependencies (Node stdlib
# only) and therefore no lockfile, so there is nothing for Dependabot to resolve. Add
# one here the moment a dependency is introduced.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]
