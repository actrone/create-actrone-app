name: CI

# Fast gate on every PR + push: the scaffolder is pure, dependency-free Node, so the
# whole suite is `node --test` (no install, no build). Node 22 per package.json engines.
# The e2e jobs then prove what a user actually gets: a scaffolded project installed from the npm
# registry, typechecked with TypeScript 7, run, and wired into each framework's newest release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # No dependencies to install: the package uses only the Node stdlib.
      - name: Run tests
        run: node --test
      # Smoke-check the CLI entry actually runs.
      - name: CLI smoke test
        run: node bin/create-actrone-app.mjs --help

  e2e:
    name: Scaffolded project (${{ matrix.framework }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    strategy:
      # One framework failing must not hide the state of the others.
      fail-fast: false
      matrix:
        node: ["22"]
        framework:
          - core
          - vercel
          - langchain
          - langgraph
          - mastra
          - llamaindex
          - openai-agents
          - genkit
          - voltagent
          - claude-agent-sdk
          - cloudflare-agents
          - inngest-agentkit
        include:
          # The starter on the current Node LTS as well as the oldest one the engines allow.
          - framework: core
            node: "24"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Scaffold, install, typecheck and run
        run: node scripts/e2e.mjs ${{ matrix.framework }}
