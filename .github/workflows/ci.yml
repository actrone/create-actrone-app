name: CI

# Fast gate on every PR + push: the scaffolder is pure, dependency-free Node, so the
# whole suite is `node --test` (no install, no build). Node 22 per package.json engines.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # No dependencies to install: the package uses only the Node stdlib.
      - name: Run tests
        run: node --test
      # Smoke-check the CLI entry actually runs.
      - name: CLI smoke test
        run: node bin/create-actrone-app.mjs --help
